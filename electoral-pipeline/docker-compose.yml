# The host filesystem mounts. Every service that does discovery (web,
# worker, beat) or opens PDFs (worker) needs the same view, so the list is
# declared once here as an anchor and referenced by name.
#
# THE UNC FORM IS REQUIRED ON WINDOWS. "C:/Users:/host/c/Users" is parsed
# by Compose as source "C" and target "/Users", which does not exist, and
# the mount is silently empty -- the container starts, looks healthy, and
# cannot see the drive. "//c/Users:/host/c/Users" is the form that
# actually binds. On a Linux host the equivalent "/srv/rolls:/srv/rolls"
# needs no escaping at all, which is why the same compose file works on
# both once the mounts are right.
#
# Only drives that exist on the host can be mounted. There is no way to
# reach an E: that is not there, and typing one is reported as an unknown
# drive rather than silently finding nothing.
x-host-mounts: &host-mounts
  - ./sample-pdfs:/data/pdfs
  - type: bind
    source: //c/Users
    target: /host/c/Users
  - type: bind
    source: //d
    target: /host/d
  # The ingest folder is where PDFs from unmapped paths are copied so they
  # become discoverable without needing a new mount. Must be present on all
  # services that run discover (web, worker, beat).
  - type: bind
    source: ./ingest
    target: /data/ingest

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: electoral
      POSTGRES_USER: electoral
      POSTGRES_PASSWORD: electoral
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electoral"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    ports: ["127.0.0.1:8082:8082"]
    environment:
      # 12 of the 16 cores the WSL2 VM exposes. The code defaults to
      # min(8, cpu_count), which would leave half the box idle. Each worker
      # runs one card through Tesseract subprocesses, and OMP_THREAD_LIMIT=1
      # keeps those from nesting threads, so one core per worker is the unit.
      - OCR_CARD_WORKERS=14
    volumes:
      # The service module is bind-mounted so a `docker compose up` can never
      # silently revert to an older copy baked into the image. Previously the
      # code lived only in the image, so restarting the stack discarded every
      # edit made with `docker compose cp` and the container ran stale logic
      # while looking perfectly healthy.
      - ./ocr_pdf_api.py:/app/ocr_pdf_api.py:ro
      - ./sample-pdfs:/data/pdfs
      # PaddleOCR downloads ~16 MB of model weights into /root/.paddleocr on
      # first use. Without a mount that path is part of the container's
      # writable layer, so every `docker compose up` re-downloads all three
      # models before page 1 can start. This volume keeps them across
      # restarts. Sized for the model cache only -- nothing else writes here.
      - ocr-paddle-cache:/root/.paddleocr
      # Mounted where ocr_pdf_api.py actually writes. OCR_OUTPUT_DIR defaults to
      # <parent of the module's dir>/results, which inside the container is
      # /results -- mounting it under the office path instead left every saved
      # extraction JSON in an unnamed directory that a container restart erased.
      - ocr-results:/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      retries: 20

  init:
    build: .
    # Exec form, not the string "python -m app.init_db && python -m app.migrate".
    # Compose resolves the string form to ["python", "-m", "app.init_db"] and
    # silently discards everything from "&&" onward, so the migration never ran
    # and the bilingual columns were never added -- while the container still
    # exited 0, looking like a clean success.
    command: ["sh", "-c", "python -m app.init_db && python -m app.migrate"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}

  web:
    build: .
    env_file: .env
    environment:
      - EXTRACTOR_TIMEOUT_SECONDS=5400
      - PAGES_PER_UNIT=3
      - TRANSLITERATION_SCHEME=itrans
      # Where the host drives are bind-mounted. A folder path typed in the UI
      # is rewritten to sit under this root, so "C:\Users\me\Rolls" becomes
      # /host/c/Users/me/Rolls. Every drive listed in the anchor above is
      # reachable; anything else is reported as an unknown drive.
      - HOST_MOUNT_ROOT=/host
    ports: ["127.0.0.1:${WEB_PORT:-8088}:8000"]
    volumes: *host-mounts
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ocr: {condition: service_healthy}

  worker:
    build: .
    # Concurrency 1 on purpose. Each unit is a 3-page OCR request, and the OCR
    # service already runs its 30 cards in parallel. Two units at once put this
    # 8-core box at load 40 (5x oversubscribed) and every unit slowed to a crawl,
    # which is what made the earlier runs time out rather than finish.
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=1
    env_file: .env
    environment:
      - EXTRACTOR_TIMEOUT_SECONDS=5400
      - PAGES_PER_UNIT=3
      - TRANSLITERATION_SCHEME=itrans
      - HOST_MOUNT_ROOT=/host
    volumes: *host-mounts
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ocr: {condition: service_healthy}

  beat:
    build: .
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      - EXTRACTOR_TIMEOUT_SECONDS=5400
      - PAGES_PER_UNIT=3
      - TRANSLITERATION_SCHEME=itrans
      - HOST_MOUNT_ROOT=/host
    volumes: *host-mounts
    depends_on:
      init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ocr: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  ocr-results:
  ocr-paddle-cache: