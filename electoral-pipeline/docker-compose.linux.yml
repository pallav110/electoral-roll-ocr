# Linux/Ubuntu deployment override.
#
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
#
# Compose MERGES these two files rather than replacing one with the other, so
# every service, volume and healthcheck defined in docker-compose.yml still
# applies. This file only changes what genuinely differs on a Linux host.
# The Windows deployment is untouched and needs no override:
#
#   docker compose up -d
#
#
# ---------------------------------------------------------------------------
# WHY THE BASE FILE CANNOT BE USED AS-IS ON LINUX
# ---------------------------------------------------------------------------
# The base file mounts drives with the UNC form, "//c/Users:/host/c/Users".
# That is Windows-only Compose syntax: Compose special-cases a leading double
# slash as a Windows drive path. On Linux it is parsed as an ordinary relative
# path, so the mount does not bind the drive -- it binds a directory that does
# not exist. The container still starts and looks perfectly healthy while
# /host/c is empty, which is the worst kind of failure: silent, and reported as
# "0 PDFs found" rather than as an error.
#
# Linux has no drive letters, so the whole concept does not carry over. What
# does carry over is the intent -- a folder typed in the UI should resolve to
# real files wherever it lives -- and the way to get there is to mount the
# host's filesystem root and let the typed path hang off it.
#
# NOTE ON MERGING. Compose APPENDS a service's `volumes` list rather than
# replacing it, so a plain re-declaration here would leave the base file's
# Windows mounts ("//c/Users", "//d") in the merged result, where `up` dies with
# "bind source path does not exist". This file previously tried to cancel them by
# re-declaring each target with bind.create_host_path: false. That does not work:
# `docker compose config` showed both entries in the output, the inherited one
# without the flag and the cancelled one with it, because volumes are merged by
# target rather than replaced.
#
# `!override` is Compose's actual replacement semantics. It was verified against
# Compose v5.5.1 before being used here: the merged output contains no //c/Users
# and no //d, and does contain ./app:/code/app.
x-host-mounts: &host-mounts !override
  # Bind-mount the application package, so template and UI edits on the host are
  # what the services serve. The previous version of this file omitted this, and
  # because volumes are appended rather than replaced the base entry survived --
  # but only by accident, not by intent.
  - ./app:/code/app
  - ./sample-pdfs:/data/pdfs
  # Where PDFs from paths the container cannot read are copied so they become
  # discoverable without a new mount. Must be present on all services that run
  # discover (web, worker-control, worker-ocr, beat).
  - type: bind
    source: ./ingest
    target: /data/ingest

  # The host root. This is what makes "any path" work for ANY absolute path,
  # including the ones people actually use: /home, /mnt, /media, /srv.
  #
  # Read-only. Nothing in this pipeline writes to a scanned folder, so there is
  # no reason to grant write access to the entire filesystem -- and a pipeline
  # bug that deletes a voter's home directory is not a failure anyone wants to
  # debug in production.
  #
  # Paths that are NOT under this mount (the container's own /data/pdfs,
  # /data/ingest) keep working as before, because _resolve_scan_path passes
  # already-resolved container paths straight through.
  - type: bind
    source: /
    target: /host
    read_only: true

services:
  web:
    environment:
      # Selects the "append the absolute path to the mount root" rewrite in
      # app/workflow.py instead of the Windows drive-letter rule. This is set
      # explicitly rather than detected: the containers are always Linux, so
      # runtime detection would report "posix" on a Windows host and silently
      # break the drive-letter mapping that host depends on.
      - HOST_MOUNT_STYLE=posix
      - HOST_MOUNT_ROOT=/host
    volumes: *host-mounts

  worker-control:
    environment:
      - HOST_MOUNT_STYLE=posix
      - HOST_MOUNT_ROOT=/host
    volumes: *host-mounts

  worker-ingest:
    environment:
      - HOST_MOUNT_STYLE=posix
      - HOST_MOUNT_ROOT=/host
    volumes: *host-mounts

  worker-ocr:
    environment:
      - HOST_MOUNT_STYLE=posix
      - HOST_MOUNT_ROOT=/host
    volumes: *host-mounts

  beat:
    environment:
      - HOST_MOUNT_STYLE=posix
      - HOST_MOUNT_ROOT=/host
    volumes: *host-mounts
